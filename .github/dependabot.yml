version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/packages/feedbot-core"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    directory: "/packages/feedbot-api"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    ignore:
      # mcp 2.x removed mcp.server.fastmcp (renamed to MCPServer). Migrate the code first,
      # then lift the <2 pin by hand.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    directory: "/packages/feedbot-bot"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    directory: "/packages/feedbot-mcp"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    ignore:
      # mcp 2.x removed mcp.server.fastmcp (renamed to MCPServer). Migrate the code first,
      # then lift the <2 pin by hand.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/packages/feedbot-api"
    schedule: { interval: "weekly" }
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/packages/feedbot-bot"
    schedule: { interval: "weekly" }
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directories:
      - "/apps/installer-host"
      - "/apps/marketing"
      - "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # @types/node segue o Node do runtime (apps/web: node:22-alpine; CI: Node 22).
      # Sobe a major à mão quando o runtime subir.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Uma major nova do Postgres não arranca sobre o volume de dados da anterior
      # (exige pg_dump/restore ou pg_upgrade planeado, com backup). Nunca por PR automático.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
